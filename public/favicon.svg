<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#080E1A"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5C4"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="f">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base triangle -->
  <polygon points="32,10 54,52 10,52" fill="url(#glow)" stroke="url(#g)" stroke-width="2" filter="url(#f)"/>
  <!-- Inner peak -->
  <polygon points="32,24 44,52 20,52" fill="url(#g)" opacity="0.9"/>
  <!-- Apex dot -->
  <circle cx="32" cy="10" r="2.5" fill="#00F5C4" filter="url(#f)"/>
</svg>
